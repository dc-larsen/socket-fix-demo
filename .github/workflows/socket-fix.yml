name: Socket Fix

on:
  schedule:
    # Daily at noon UTC. Keep at least one commit every ~60 days or GitHub
    # disables scheduled workflows for repo inactivity.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  socket-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Socket Fix
        env:
          # Prefer a PAT or GitHub App token. PRs opened with the default
          # GITHUB_TOKEN do not trigger other workflows, so required checks
          # never run and auto-merge waits forever.
          SOCKET_CLI_GITHUB_TOKEN: ${{ secrets.SOCKET_FIX_PAT || secrets.GITHUB_TOKEN }}
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}
          SOCKET_CLI_GIT_USER_NAME: socket-fix[bot]
          SOCKET_CLI_GIT_USER_EMAIL: socket-fix[bot]@users.noreply.github.com
        run: >
          pnpm dlx @socketsecurity/cli fix
          --autopilot
          --no-major-updates
          --minimum-release-age 7d
          --pr-limit 5
